<title>Luồng Chứng từ bán hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
:root{
  --ink:#16202b; --ink-soft:#4a5765; --ink-faint:#7c8896;
  --bg:#f4f6f8; --surface:#ffffff; --rule:#dde3e9; --rule-soft:#eaeef2;
  --blue:#2f6f8f; --blue-soft:#e8f0f4;
  --seal:#b23a2e; --seal-soft:#fbeceb;
  --ok:#2e7d5b; --ok-soft:#e8f4ee;
  --warn:#a9761f; --warn-soft:#fbf2e2;
  --plate:#faf8f3; --plate-rule:#e3ded2;
  --shadow:0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#dfe5ec; --ink-soft:#a3aeba; --ink-faint:#7a8592;
    --bg:#10151b; --surface:#171e26; --rule:#2a333d; --rule-soft:#212a33;
    --blue:#6fb3d0; --blue-soft:#1a2b34;
    --seal:#e0705f; --seal-soft:#2e1c1a;
    --ok:#63b992; --ok-soft:#152720;
    --warn:#d5a45a; --warn-soft:#2a2113;
    --plate:#e7e3da; --plate-rule:#cdc7b9;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#dfe5ec; --ink-soft:#a3aeba; --ink-faint:#7a8592;
  --bg:#10151b; --surface:#171e26; --rule:#2a333d; --rule-soft:#212a33;
  --blue:#6fb3d0; --blue-soft:#1a2b34;
  --seal:#e0705f; --seal-soft:#2e1c1a;
  --ok:#63b992; --ok-soft:#152720;
  --warn:#d5a45a; --warn-soft:#2a2113;
  --plate:#e7e3da; --plate-rule:#cdc7b9;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px 96px;
  display:grid; grid-template-columns:236px minmax(0,1fr); gap:56px; align-items:start}
@media (max-width:980px){ .wrap{grid-template-columns:1fr; gap:0} }

/* ---------- masthead ---------- */
.mast{grid-column:1/-1; padding:56px 0 28px; border-bottom:2px solid var(--ink)}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--seal); margin:0 0 14px}
.mast h1{font-family:Bitter,Georgia,serif; font-weight:700; font-size:clamp(30px,4.4vw,46px);
  line-height:1.12; margin:0 0 14px; text-wrap:balance; letter-spacing:-.015em}
.mast p{margin:0; max-width:64ch; color:var(--ink-soft); font-size:17px}
.mast .meta{display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:22px;
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink-faint)}
.mast .meta b{color:var(--ink-soft); font-weight:600}

/* ---------- rail ---------- */
nav.rail{position:sticky; top:24px; padding-top:36px}
@media (max-width:980px){ nav.rail{position:static; padding:28px 0 0; border-bottom:1px solid var(--rule)} }
nav.rail h2{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-faint); margin:0 0 14px; font-weight:600}
nav.rail ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
nav.rail a{display:grid; grid-template-columns:26px 1fr; gap:6px; text-decoration:none;
  color:var(--ink-soft); font-size:14px; padding:5px 8px 5px 0; border-radius:4px; line-height:1.35}
nav.rail a span{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-faint)}
nav.rail a:hover{color:var(--blue)}
nav.rail a:hover span{color:var(--blue)}
nav.rail a:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

/* ---------- sections ---------- */
main{padding-top:36px; min-width:0}
section{padding:34px 0 6px; border-top:1px solid var(--rule)}
section:first-child{border-top:none; padding-top:8px}
.snum{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  color:var(--seal); font-weight:600; display:block; margin-bottom:8px}
h2{font-family:Bitter,Georgia,serif; font-weight:700; font-size:27px; line-height:1.22;
  margin:0 0 10px; text-wrap:balance; letter-spacing:-.01em}
h3{font-family:Bitter,Georgia,serif; font-weight:500; font-size:18px; margin:32px 0 8px}
p{margin:0 0 14px; max-width:72ch}
.lede{color:var(--ink-soft); font-size:16.5px; max-width:70ch}
a{color:var(--blue)}
code,.f{font-family:"IBM Plex Mono",monospace; font-size:.87em; background:var(--rule-soft);
  padding:1px 5px; border-radius:3px; color:var(--ink)}
strong{font-weight:600}
ul{margin:0 0 16px; padding-left:20px; max-width:72ch}
li{margin-bottom:6px}
li::marker{color:var(--ink-faint)}

/* ---------- figure / plate ---------- */
figure{margin:22px 0 8px}
.plate{background:var(--plate); border:1px solid var(--plate-rule); border-radius:6px;
  padding:20px 16px; overflow-x:auto; box-shadow:var(--shadow)}
.plate .mermaid{min-width:min-content; margin:0}
.plate .mermaid svg{max-width:none !important; height:auto; display:block}

/* ---------- font nhãn sơ đồ — PHẢI khai phạm vi TOÀN TRANG ----------
   mermaid dựng sơ đồ trong container tạm gắn ở <body>, đo bề rộng từng nhãn ở đó rồi mới
   chuyển SVG vào pre.mermaid. Khai font scope vào .plate thì lúc đo chưa áp, lúc vẽ mới áp
   → hộp hẹp hơn chữ → lẹm đuôi chữ. font-size phải ĐÚNG BẰNG themeVariables.fontSize. */
.mermaid,.nodeLabel,.edgeLabel,.cluster-label,.label,
foreignObject div,foreignObject span,foreignObject p{
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif !important}
.nodeLabel,.edgeLabel,.cluster-label,.label,foreignObject div{
  font-size:14px !important; line-height:1.4 !important}
/* lưới an toàn: sai số đo vài px cũng không cắt chữ */
foreignObject{overflow:visible !important}

figcaption{margin-top:10px; font-size:13.5px; color:var(--ink-faint); max-width:70ch;
  border-left:2px solid var(--rule); padding-left:12px}
figcaption b{color:var(--ink-soft); font-weight:600}

/* ---------- tables ---------- */
.tw{overflow-x:auto; margin:18px 0 22px; border:1px solid var(--rule); border-radius:6px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:520px}
th,td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
thead th{background:var(--rule-soft); font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;
  border-bottom:1px solid var(--rule); white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.mono,th.mono{font-family:"IBM Plex Mono",monospace; font-size:12.5px; white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- chips ---------- */
.chip{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:11.5px;
  padding:2px 7px; border-radius:3px; border:1px solid; white-space:nowrap; line-height:1.5}
.c-msg{color:var(--seal); border-color:var(--seal); background:var(--seal-soft)}
.c-br{color:var(--blue); border-color:var(--blue); background:var(--blue-soft)}
.c-ok{color:var(--ok); border-color:var(--ok); background:var(--ok-soft)}
.c-warn{color:var(--warn); border-color:var(--warn); background:var(--warn-soft)}
.c-perm{color:var(--ink-soft); border-color:var(--rule); background:var(--rule-soft)}

/* ---------- callout ---------- */
.note{border-left:3px solid var(--blue); background:var(--blue-soft); padding:14px 18px;
  border-radius:0 5px 5px 0; margin:20px 0; font-size:14.5px}
.note.stop{border-color:var(--seal); background:var(--seal-soft)}
.note p:last-child{margin-bottom:0}
.note .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; font-weight:600; display:block; margin-bottom:6px; color:var(--blue)}
.note.stop .lbl{color:var(--seal)}

footer{grid-column:1/-1; margin-top:56px; padding-top:22px; border-top:2px solid var(--ink);
  font-size:13px; color:var(--ink-faint); display:flex; flex-wrap:wrap; gap:8px 28px;
  font-family:"IBM Plex Mono",monospace}
</style>
